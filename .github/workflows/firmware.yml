name: firmware

on:
  push:
    paths: ['firmware/**', '.github/workflows/firmware.yml']
  pull_request:
    paths: ['firmware/**', '.github/workflows/firmware.yml']

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cmake -S firmware/tests -B build-host
      - run: cmake --build build-host
      - run: ctest --test-dir build-host --output-on-failure

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board: [acq, display, gen]
    steps:
      - uses: actions/checkout@v5
      - name: Placeholder secrets for CI
        if: matrix.board == 'display'
        run: cp firmware/display/main/secrets_example.h firmware/display/main/secrets.h
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: firmware/${{ matrix.board }}